<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estímulos</title>
<style>
:root{--bg:#ececec;--bar:#d9d9d9;--ink:#222}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:8px}
/* a imagem ocupa toda a área disponível (amplia ou reduz), mantendo a proporção */
#stage img,#stage canvas{width:100%;height:100%;object-fit:contain;display:block}
#bar{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bar)}
button,a.b,input{font:inherit;color:var(--ink);background:#fff;border:1px solid #aaa;border-radius:8px;padding:8px 14px;text-decoration:none;cursor:pointer}
button:focus-visible,a.b:focus-visible,input:focus-visible{outline:2px solid #222;outline-offset:2px}
button[aria-pressed=true]{background:#222;color:#fff}
input{width:4.2em;text-align:center;cursor:text;padding:8px 4px}
#t{margin-right:auto}
</style>
</head>
<body>
<div id="stage"><img id="im" alt="Estímulo"></div>
<div id="bar">
  <a class="b" id="back" href="index.html" title="Voltar ao livro">Livro</a>
  <span id="t"></span>
  <button id="prev" aria-label="Página anterior">◀</button>
  <input id="go" inputmode="numeric" aria-label="Ir para a página" placeholder="pág.">
  <button id="next" aria-label="Próxima página">▶</button>
  <button id="zoom" aria-pressed="false" title="Cortar margem branca">Zoom</button>
</div>
<script>
// ---- Catálogo de estímulos -------------------------------------------------
// N(a,b): números de a a b | F(prefixo,números,casas): nomes "prefixo01.webp"
const N=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const F=(pre,nums,pad=0)=>nums.map(n=>pre+String(n).padStart(pad,"0")+".webp");
const T=(n,d,pre,nums,pad=0)=>({n,d,f:F(pre,nums,pad),x:nums});
const SEM_4=[1,2,3,...N(5,36)]; // Tuesday não tem a página 4

const TESTES={
  // WAIS-IV
  completar:T("Completar Figuras","Wais/completarfiguras","pagina_",N(3,27),2),
  matricial:T("Raciocínio Matricial","Wais/raciociniomatricial","pagina_",N(49,77),2),
  codigos:T("Códigos","Wais/codigos","Códigos_WAIS_-",N(1,7)),
  simbolos:T("Procurar Símbolos","Wais/procurarsimbolos","Procurar_Símbolos_WAIS_-",N(1,7)),
  // Emocional (ADOS)
  tuesday:T("Tuesday","ADOS/Tuesday","Tuesday_",SEM_4,2),
  eyes:T("Eyes","Eyes","pagina_",N(1,37),2),
  mapa:{n:"Mapa",d:"ADOS/mapa",f:["ADOS_pagina_1.webp"],x:[1]},
  resort:{n:"Resort",d:"ADOS/resort",f:["ADOS_pagina_2.webp"],x:[1]},
  vinhetas:T("Vinhetas","ADOS/vinhetas","pagina_",N(1,6),2),
  // Atenção
  bpa:T("BPA","BPA","BPA-",N(1,12)),
  cta:T("CTA","CTA","CTA-",N(1,9)),
  d2r:T("D2-R","D2R","D2R-",N(1,6)),
  fdt:T("FDT","FDT","",N(1,8)),
  minnesota:{n:"Problemas de Minnesota",d:"Minessota",f:["Problemas_Minnesota.webp"],x:[1]},
  // Visual
  hooper:T("Hooper","Hooper","",N(2,31),2),
  rey:{n:"Figura de Rey",d:"figuraderey",f:["A.webp"],x:[1]},
  // Linguagem
  boston:T("Nomeação de Boston","Nomeacaodeboston","",N(2,62),2),
  tlpp:T("TLPP","TLPP","",N(2,75),2),
  biscoitos:{n:"Roubo dos Biscoitos",d:"roubodosbiscoitos",f:["Roubo_dos_Biscoitos.webp"],x:[1]},
  // Memória (WRAML)
  wramlcenas:T("WRAML · Cenas (reconhecimento)","wraml/wramlmemoriaparacenareconhecimento","imagem_",N(1,44)),
  wramldesenhos:T("WRAML · Desenhos","wraml/wramlmemoriaparadesenhos","pagina_",N(2,12),2),
  wramldesenhosrec:T("WRAML · Desenhos (reconhecimento)","wraml/wramlmemoriaparadesenhosrec","forma_",N(1,46))
};
// ----------------------------------------------------------------------------
const q=new URLSearchParams(location.search),TT=TESTES[q.get("t")]||TESTES.fdt;
const stage=document.getElementById("stage"),t=document.getElementById("t");
let cur=Math.max(0,TT.x.indexOf(+q.get("p"))),zoomed=false;
document.title=TT.n;t.textContent=TT.n;
const src=i=>TT.d.split("/").map(encodeURIComponent).join("/")+"/"+encodeURIComponent(TT.f[i]);
function trim(img){ // corta a margem branca
  const s=Math.min(1,600/img.naturalWidth),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});
  x.drawImage(img,0,0,w,h);const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){const k=(y*w+i)*4;if(d[k+3]>10&&(d[k]<235||d[k+1]<235||d[k+2]<235)){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<=x0||y1<=y0)return null;const m=8;
  const r={x:Math.max(0,x0-m)/s,y:Math.max(0,y0-m)/s};r.w=Math.min(w,x1+m)/s-r.x;r.h=Math.min(h,y1+m)/s-r.y;return r;
}
function render(){
  const img=new Image();img.alt="Estímulo";
  img.onload=()=>{
    stage.innerHTML="";
    if(zoomed){const r=trim(img);if(r){const c=document.createElement("canvas");c.width=r.w;c.height=r.h;c.getContext("2d").drawImage(img,r.x,r.y,r.w,r.h,0,0,r.w,r.h);stage.appendChild(c);return}}
    stage.appendChild(img);
  };
  img.src=src(cur);
  const nx=new Image();if(cur<TT.f.length-1)nx.src=src(cur+1);
  document.getElementById("go").placeholder="pág. "+TT.x[cur];
  const u=new URL(location);u.searchParams.set("p",TT.x[cur]);history.replaceState(null,"",u);
}
function go(i){cur=Math.min(TT.f.length-1,Math.max(0,i));render()}
function goNum(n){const i=TT.x.indexOf(n);go(i<0?cur:i)}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("zoom").onclick=e=>{zoomed=!zoomed;e.currentTarget.setAttribute("aria-pressed",zoomed);render()};
document.getElementById("go").addEventListener("keydown",e=>{if(e.key==="Enter"&&+e.target.value){goNum(+e.target.value);e.target.value="";e.target.blur()}e.stopPropagation()});
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);if(e.key==="z")document.getElementById("zoom").click()});
let sx=null;stage.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
stage.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(cur+(dx<0?1:-1));sx=null});
render();
</script>
</body>
</html>
