<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Livro de Estímulos — Dark Academia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet">

<style>

:root{

 --bg:#151713; --bg2:#20221b; --leather:#30251d; --leather2:#493326;

 --brass:#b79a62; --brass-dim:#806b45; --paper:#d6c6a2; --paper2:#c6b48d;

 --ink:#30271d; --muted-ink:#68543a; --wine:#672d32; --wine2:#481f27;

 --forest:#26392f; --moss:#65724e; --rust:#a45f43; --blue:#587579;

}

*{box-sizing:border-box}

html,body{width:100%;height:100%;margin:0}

body{

 overflow:hidden; display:flex;align-items:center;justify-content:center;

 padding:clamp(8px,1.7vh,18px) clamp(8px,1.8vw,24px);

 color:var(--ink);

 background:radial-gradient(ellipse at 50% 42%,#333126 0,#20221c 48%,#11130f 100%);

 font-family:"Cormorant Garamond",Georgia,serif;

}

.book{

 width:min(1240px,100%);height:min(900px,calc(100dvh - 2.8vh));

 min-height:0;display:flex;position:relative;align-items:stretch;

 padding:clamp(8px,1.2vw,15px);

 background:linear-gradient(90deg,#241b16,#59402d 3%,#30231b 7%,#3d2a20 93%,#6a4a30 97%,#211a15);

 border:2px solid var(--brass-dim);border-radius:22px 28px 27px 22px;

 box-shadow:0 18px 45px #0008,inset 0 0 0 3px #211812,inset 0 0 0 5px #8c6d43;

}

.book:after{

 content:"";position:absolute;inset:7px;z-index:6;pointer-events:none;border-radius:16px 21px 20px 16px;

 background:

  linear-gradient(var(--brass) 0 0) left 15px top 15px/26px 1px no-repeat,

  linear-gradient(var(--brass) 0 0) left 15px top 15px/1px 26px no-repeat,

  linear-gradient(var(--brass) 0 0) right 15px top 15px/26px 1px no-repeat,

  linear-gradient(var(--brass) 0 0) right 15px top 15px/1px 26px no-repeat,

  linear-gradient(var(--brass) 0 0) left 15px bottom 15px/26px 1px no-repeat,

  linear-gradient(var(--brass) 0 0) left 15px bottom 15px/1px 26px no-repeat,

  linear-gradient(var(--brass) 0 0) right 15px bottom 15px/26px 1px no-repeat,

  linear-gradient(var(--brass) 0 0) right 15px bottom 15px/1px 26px no-repeat;

 opacity:.65

}

.book:before{display:none}

.pages:before{content:"";position:absolute;z-index:1;pointer-events:none;left:50%;top:0;bottom:0;transform:translateX(-50%);width:clamp(20px,2.6vw,31px);border-left:2px solid #35251b;border-right:2px solid #35251b;border-radius:4px;background:repeating-linear-gradient(to bottom,#8b6b42 0 4px,#3b2920 4px 12px);box-shadow:0 0 0 1px #a68a59,0 0 10px #0003}

.pages{

 width:100%;min-width:0;min-height:0;display:grid;

 grid-template-columns:minmax(0,1fr) minmax(0,1fr);

 position:relative;overflow:hidden;border:2px solid #846842;border-radius:10px;

 background:

  linear-gradient(90deg, transparent 0%, #bda77c18 3%, transparent 10%, transparent 42%, #8a6b4530 49%, #6c4b2e66 50%, #f0dfba55 51%, transparent 57%, transparent 92%, #8b6c431c 100%),

  repeating-linear-gradient(0deg,transparent 0 31px,#6f5a3b0b 31px 32px),

  linear-gradient(90deg,#dfd1b1 0%,#d8c9a7 47%,#c5b18a 50%,#d9c9a5 53%,#e0d2b4 100%);

 box-shadow:inset 0 0 0 4px #9b7e50,inset 0 0 0 7px #e6d7b7,inset 0 0 28px #4c382322;

 background-image:

  radial-gradient(ellipse at 8% 12%,#fff3d42b 0,transparent 32%),

  radial-gradient(ellipse at 91% 88%,#74532b12 0,transparent 35%),

  linear-gradient(90deg, transparent 0%, #bda77c18 3%, transparent 10%, transparent 42%, #8a6b4525 49%, #6c4b2e55 50%, #f0dfba55 51%, transparent 57%, transparent 92%, #8b6c431c 100%),

  repeating-linear-gradient(0deg,transparent 0 31px,#6f5a3b08 31px 32px),

  linear-gradient(90deg,#dfd1b1 0%,#d8c9a7 47%,#c5b18a 50%,#d9c9a5 53%,#e0d2b4 100%);

}

.pages:after{content:"";position:absolute;z-index:2;pointer-events:none;left:50%;top:0;bottom:0;width:clamp(28px,3.4vw,42px);transform:translateX(-50%);background:linear-gradient(90deg,#4a342822 0%,#8b6a4548 22%,#f1dfbb66 48%,#72523755 75%,#3c2a1c22 100%);box-shadow:0 0 7px #5b41221a}

/* V17 — virada de página mais rica, presa à quina externa das folhas */

.page-turn{position:absolute;z-index:20;top:0;bottom:0;width:clamp(24px,3vw,38px);border:0;padding:0;background:transparent;cursor:pointer;color:#5b4028;opacity:.98;display:flex;align-items:center;justify-content:center;perspective:220px;transition:background .25s ease}

.page-turn.prev{left:0}.page-turn.next{right:0}

.page-turn.prev:hover{background:linear-gradient(90deg,#72533118,transparent)}.page-turn.next:hover{background:linear-gradient(270deg,#72533118,transparent)}

.page-turn .turn-label{display:none!important}

.page-turn .turn-icon{position:absolute;top:0;width:0;height:0;border:0;filter:none;transition:all .42s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d;pointer-events:none}

.page-turn.prev .turn-icon{left:0;transform-origin:top left;clip-path:polygon(0 0,100% 0,0 100%);background:linear-gradient(135deg,#9c784b 0%,#e9d5a8 43%,#f5e9ca 48%,#bca071 62%,#80603d 100%);box-shadow:3px 4px 7px #39261940}

.page-turn.next .turn-icon{right:0;transform-origin:top right;clip-path:polygon(0 0,100% 0,100% 100%);background:linear-gradient(225deg,#9c784b 0%,#e9d5a8 43%,#f5e9ca 48%,#bca071 62%,#80603d 100%);box-shadow:-3px 4px 7px #39261940}

.page-turn:hover .turn-icon,.page-turn:focus-visible .turn-icon{width:clamp(34px,5vw,62px);height:clamp(34px,5vw,62px);filter:drop-shadow(2px 5px 3px #39261945)}

.page-turn.prev:hover .turn-icon,.page-turn.prev:focus-visible .turn-icon{transform:rotateY(-24deg) rotateX(8deg) translate(1px,1px)}

.page-turn.next:hover .turn-icon,.page-turn.next:focus-visible .turn-icon{transform:rotateY(24deg) rotateX(8deg) translate(-1px,1px)}

.page-turn:active .turn-icon{width:clamp(42px,6vw,72px);height:clamp(42px,6vw,72px);filter:drop-shadow(1px 2px 2px #39261950)}

.page-turn:focus-visible{outline:2px solid #b99b62;outline-offset:-3px}

@media(prefers-reduced-motion:reduce){.page-turn,.page-turn .turn-icon,.page-turn .turn-label{transition:none}}

.pg{

 min-width:0;min-height:0;overflow:hidden;position:relative;z-index:0;

 background:linear-gradient(90deg,#fff0 0%,#fff0 88%,#7c5d3710 100%);

 padding:clamp(18px,2.8vh,30px) clamp(18px,2vw,29px) clamp(16px,2.4vh,24px);

 display:flex;flex-direction:column;gap:clamp(7px,1.3vh,13px);

 background-image:radial-gradient(ellipse at 20% 15%,#fff8e51c,transparent 48%),repeating-linear-gradient(113deg,transparent 0 17px,#725a3810 18px,transparent 19px 37px),linear-gradient(90deg,#fff0 0%,#fff0 88%,#7c5d3710 100%);

}

.pg:first-child{box-shadow:inset 5px 0 12px #6c4d2a0c,inset -7px 0 15px #6b4a2b12}

.pg:last-child{grid-column:3;box-shadow:inset 7px 0 16px #4a311d17,inset -4px 0 10px #6b4a2b0b}

.pg:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;

 background:linear-gradient(90deg,#fff0 0%,#fff0 78%,#6e4d2c0b 92%,#56391d15 100%),radial-gradient(ellipse at 50% 0%,#fff4d20b,transparent 60%);

 box-shadow:inset 0 0 0 1px #fff2,inset 0 0 16px #795a3210}

.pg:after{content:"";position:absolute;inset:10px 9px;pointer-events:none;border:1px solid #9d80501c;border-radius:2px;z-index:0}

.pg>*{position:relative;z-index:4}

.pg:first-child:before{background:linear-gradient(90deg,#fff0 0%,#fff0 82%,#77542c12 96%,#5c3d211f 100%),radial-gradient(ellipse at 50% 0%,#fff4d20b,transparent 60%)}

.pg:last-child:before{background:linear-gradient(90deg,#51351d20 0%,#76543112 4%,#fff0 20%,#fff0 88%,#6e4d2c08 100%),radial-gradient(ellipse at 50% 100%,#7b5a3210,transparent 62%)}

/* Cantos impressos e marcas discretas de papel envelhecido. */

.pg .seals:before{content:"";position:absolute;inset:4px 2px;pointer-events:none;opacity:.32;

 background:radial-gradient(circle at 0 0,#9a7b4c 0 1px,transparent 2px),radial-gradient(circle at 100% 0,#9a7b4c 0 1px,transparent 2px),radial-gradient(circle at 0 100%,#9a7b4c 0 1px,transparent 2px),radial-gradient(circle at 100% 100%,#9a7b4c 0 1px,transparent 2px)}

.kicker{font:10px "Special Elite",monospace;letter-spacing:.1em;text-transform:uppercase;color:#796342;margin-bottom:1px}

.heading-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid #65513755;padding-bottom:12px}

.heading-copy{min-width:0;flex:1}

h1{font:400 clamp(1.65rem,3.3vh,2.55rem)/1.02 "IM Fell English SC",serif;margin:0 0 7px;color:#493222;letter-spacing:.015em}

.sub{font-size:clamp(1rem,1.9vh,1.25rem);line-height:1.25;font-style:italic;color:#70583c;margin:0;max-width:34ch}

.stamp{flex:none;width:clamp(48px,6.4vh,66px);height:clamp(48px,6.4vh,66px);display:grid;place-items:center;text-align:center;padding:5px;border:1.5px dashed #89513b;border-radius:50%;background:#bca16e;color:#5a3528;font:9px/1.15 "Special Elite",monospace;transform:rotate(7deg)}

.seals{display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;gap:clamp(12px,1.8vw,24px);flex:1;min-height:0;padding:14px 8px 12px;position:relative;isolation:isolate}

.seal{

 --w:clamp(132px,17vh,190px);--h:clamp(100px,13vh,142px);

 width:var(--w);height:var(--h);flex:0 0 var(--w);

 display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 13px;

 position:relative;overflow:visible;overflow-wrap:break-word;hyphens:none;word-break:normal;

 color:#f0dfbd;text-decoration:none;font:600 clamp(.9rem,1.8vh,1.08rem)/1.18 "Cormorant Garamond",Georgia,serif;

 border:1.5px solid #b89a63;

 background:radial-gradient(ellipse at 28% 18%,#9b7050 0%,transparent 42%),linear-gradient(145deg,#76503a 0%,#56372a 55%,#32231d 100%);

 box-shadow:0 7px 10px #33231842,0 1px 1px #f2dba52b,inset 0 2px 1px #e0c28b99,inset 2px 0 2px #d4bb8055,inset -2px -3px 6px #17120e55;

 cursor:pointer;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;

 filter:drop-shadow(0 2px 1px #24180f20);transform:rotate(var(--tilt,0deg)) scale(var(--seal-scale,1));

 clip-path:polygon(6% 0,94% 0,100% 10%,96% 90%,90% 100%,10% 100%,4% 90%,0 10%);

}

.seal:before{

 content:"";position:absolute;inset:6px;border:1px dashed #d5b87888;

 background:repeating-linear-gradient(135deg,transparent 0 7px,#fff1 8px,transparent 9px 15px);

 clip-path:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px #2b1b1620

}

/* Alternância de formatos: selo postal, etiqueta de arquivo, brasão e bilhete antigo. */

.seal:nth-child(4n+1){

 --w:clamp(130px,16.5vh,184px);--h:clamp(112px,14vh,150px);

 clip-path:polygon(7% 0,93% 0,100% 12%,100% 88%,93% 100%,7% 100%,0 88%,0 12%);

 background:linear-gradient(145deg,#78513b,#4c3026 68%,#32241d);

 transform:rotate(-2deg)

}

.seal:nth-child(4n+2){

 --w:clamp(146px,19vh,205px);--h:clamp(96px,12vh,130px);

 clip-path:polygon(50% 0,61% 8%,75% 4%,82% 16%,96% 23%,91% 38%,100% 50%,91% 62%,96% 77%,82% 84%,75% 96%,61% 92%,50% 100%,39% 92%,25% 96%,18% 84%,4% 77%,9% 62%,0 50%,9% 38%,4% 23%,18% 16%,25% 4%,39% 8%);

 background:radial-gradient(ellipse at 25% 15%,#a96c65 0%,transparent 43%),linear-gradient(145deg,#814d49,#622e34 72%);box-shadow:0 5px 8px #33231838,inset 0 1px 0 #e9b6a488,inset 0 -8px 12px #32161c66;transform:rotate(3deg)

}

.seal:nth-child(4n+3){

 --w:clamp(124px,15.5vh,174px);--h:clamp(124px,15.5vh,174px);

 clip-path:polygon(0 8%,7% 0,93% 0,100% 8%,96% 50%,100% 92%,93% 100%,7% 100%,0 92%,4% 50%);

 background:radial-gradient(ellipse at 24% 16%,#9b9b70 0%,transparent 45%),linear-gradient(145deg,#737653,#414a36 75%);box-shadow:0 5px 8px #33231838,inset 0 1px 0 #d6d4a088,inset 0 -8px 12px #1b241b66;transform:rotate(-1deg)

}

.seal:nth-child(4n){

 --w:clamp(132px,16.5vh,184px);--h:clamp(132px,16.5vh,184px);

 clip-path:polygon(50% 0,61% 10%,75% 5%,82% 19%,96% 25%,90% 40%,100% 50%,90% 60%,96% 75%,82% 81%,75% 95%,61% 90%,50% 100%,39% 90%,25% 95%,18% 81%,4% 75%,10% 60%,0 50%,10% 40%,4% 25%,18% 19%,25% 5%,39% 10%);

 background:radial-gradient(ellipse at 24% 16%,#9aa39a 0%,transparent 43%),linear-gradient(145deg,#777660,#4c5e5a 75%);box-shadow:0 5px 8px #33231838,inset 0 1px 0 #d6d6b388,inset 0 -8px 12px #1a2c2d66;transform:rotate(2deg)

}

.seal:hover,.seal:focus-visible{transform:translateY(-3px) scale(1.035) rotate(0);filter:brightness(1.1) drop-shadow(0 5px 3px #24180f35);z-index:2;box-shadow:0 10px 15px #33231848,inset 0 2px 1px #e0c28b99,inset 0 -8px 12px #17120e55}

/* Identidade visual própria para os selos de cada capítulo. */

.pages.chapter-0 .seal:not(.new){

 border-color:#b18a54;color:#f2dfba;

 background:radial-gradient(ellipse at 25% 15%,#a77c4b 0%,transparent 43%),linear-gradient(145deg,#76513a,#4c3026 70%,#2d2019);

 clip-path:polygon(7% 0,93% 0,100% 9%,97% 91%,90% 100%,10% 100%,3% 91%,0 9%);

}

.pages.chapter-1 .seal:not(.new){

 border-color:#7f9690;color:#f0e6cb;

 background:radial-gradient(ellipse at 28% 18%,#9aa99a 0%,transparent 42%),linear-gradient(145deg,#526d68,#334c49 68%,#243a38);

 clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%);

 border-radius:12px;

}

.pages.chapter-2 .seal:not(.new){

 border-color:#9aab79;color:#f0e6c3;

 background:radial-gradient(ellipse at 25% 15%,#9aa578 0%,transparent 43%),linear-gradient(145deg,#59694a,#354632 72%,#253326);

 clip-path:polygon(50% 0,61% 7%,75% 2%,82% 15%,96% 22%,91% 38%,100% 50%,91% 62%,96% 78%,82% 85%,75% 98%,61% 93%,50% 100%,39% 93%,25% 98%,18% 85%,4% 78%,9% 62%,0 50%,9% 38%,4% 22%,18% 15%,25% 2%,39% 7%);

}

.pages.chapter-3 .seal:not(.new){

 border-color:#7eaaa7;color:#e7e4cc;

 background:radial-gradient(ellipse at 28% 15%,#80a6a0 0%,transparent 44%),linear-gradient(145deg,#456b6a,#315254 70%,#243c40);

 clip-path:ellipse(49% 46% at 50% 50%);

}

.pages.chapter-4 .seal:not(.new){

 border-color:#b77a78;color:#f5e0d0;

 background:radial-gradient(ellipse at 25% 15%,#a9696b 0%,transparent 43%),linear-gradient(145deg,#81464b,#5e2c35 72%,#3c2028);

 clip-path:polygon(50% 0,60% 5%,67% 1%,74% 8%,83% 7%,87% 17%,96% 22%,93% 32%,100% 40%,96% 50%,100% 60%,93% 68%,96% 78%,87% 83%,83% 93%,74% 92%,67% 99%,60% 95%,50% 100%,40% 95%,33% 99%,26% 92%,17% 93%,13% 83%,4% 78%,7% 68%,0 60%,4% 50%,0 40%,7% 32%,4% 22%,13% 17%,17% 7%,26% 8%,33% 1%,40% 5%);

}

.pages.chapter-5 .seal:not(.new){

 border-color:#c0a16a;color:#fff0cd;

 background:radial-gradient(ellipse at 25% 15%,#bba06a 0%,transparent 43%),linear-gradient(145deg,#8b7040,#6d512e 72%,#44321f);

 clip-path:polygon(0 0,88% 0,100% 16%,100% 100%,12% 100%,0 84%);

}

.pages.chapter-6 .seal:not(.new){

 border-color:#a4a08a;color:#ece8d5;

 background:radial-gradient(ellipse at 25% 15%,#989b85 0%,transparent 43%),linear-gradient(145deg,#656858,#454a40 72%,#2c332e);

 clip-path:polygon(8% 0,92% 4%,100% 18%,96% 82%,85% 100%,15% 96%,0 80%,4% 20%);

}

.pages.chapter-0 .seal:before{border-style:double;border-width:3px}

.pages.chapter-1 .seal:before{border-style:dotted}

.pages.chapter-2 .seal:before{border-style:dashed}

.pages.chapter-3 .seal:before{inset:9px;border-radius:50%;border-style:solid}

.pages.chapter-4 .seal:before{border-style:dotted;border-width:2px}

.pages.chapter-5 .seal:before{inset:7px 10px;border-style:solid}

.pages.chapter-6 .seal:before{border-style:dashed;transform:rotate(-2deg)}

.pages.chapter-0 .seal:not(.new):nth-child(odd),.pages.chapter-1 .seal:not(.new):nth-child(odd),.pages.chapter-2 .seal:not(.new):nth-child(odd),.pages.chapter-3 .seal:not(.new):nth-child(odd),.pages.chapter-4 .seal:not(.new):nth-child(odd),.pages.chapter-5 .seal:not(.new):nth-child(odd),.pages.chapter-6 .seal:not(.new):nth-child(odd){transform:rotate(-2deg)}

.pages.chapter-0 .seal:not(.new):nth-child(even),.pages.chapter-1 .seal:not(.new):nth-child(even),.pages.chapter-2 .seal:not(.new):nth-child(even),.pages.chapter-3 .seal:not(.new):nth-child(even),.pages.chapter-4 .seal:not(.new):nth-child(even),.pages.chapter-5 .seal:not(.new):nth-child(even),.pages.chapter-6 .seal:not(.new):nth-child(even){transform:rotate(2deg)}

.seal:active{transform:translateY(1px) scale(.99)}

.seal.new:hover{filter:brightness(1.04);box-shadow:0 7px 10px #33231825,inset 0 0 0 3px #f0e2c155}

.seal:focus-visible,.tab:focus-visible{outline:2px solid #c8ad71;outline-offset:3px}

.seal.new{

 color:#806b4d;border:1.5px dashed #9b8158;

 background:linear-gradient(145deg,#e3d4b4,#c8b58c);

 box-shadow:inset 0 0 0 3px #f0e2c155;font-style:italic

}

.seal.new:before{border-color:#927850aa}

.left-bottom{margin-top:auto;display:flex;align-items:flex-end;gap:14px;min-height:clamp(92px,18vh,155px)}

.polaroid{width:min(48%,235px);padding:7px 7px 17px;background:#e6d7b7;border:1px solid #a58a5d;box-shadow:0 4px 8px #3021172e;transform:rotate(-4deg);margin:0 0 4px 3px}

.polaroid .art{height:clamp(55px,10vh,98px);display:grid;place-items:center;background:radial-gradient(ellipse at 25% 20%,#a9825b 0,transparent 35%),linear-gradient(145deg,#75433b,#422729 68%,#8b6546);border:3px solid #b49a6b;color:#d7c18e;font-size:2.2rem;box-shadow:inset 0 0 18px #160f0b66;position:relative;overflow:hidden}

.polaroid .art:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,#f5dfb10b 6px,transparent 7px 12px);pointer-events:none}

.polaroid figcaption{padding-top:7px;text-align:center;font-size:.82rem;line-height:1.1;color:#73593a}

.left-caption{max-width:120px;font-size:.88rem;line-height:1.25;color:#806b4e;font-style:italic;margin-bottom:9px}

.right-head{display:none}

.title-card{flex:1;min-width:0;border:2px solid #8a4b3a;border-radius:5px 10px 7px 5px;background:linear-gradient(135deg,#ead6ad,#d9bd8d);padding:11px 14px;box-shadow:2px 3px 0 #71503530,inset 0 0 0 2px #f5e5c455;transform:rotate(.25deg)}

.title-card h2{font:400 clamp(1.45rem,3vh,2.2rem)/1 "IM Fell English SC",serif;margin:0;color:#66352d}

.title-card p{margin:6px 0 0;font:9px "Special Elite",monospace;letter-spacing:.1em;color:#7b6041}

.current-label{display:none;align-items:center;gap:9px;font:10px "Special Elite",monospace;letter-spacing:.08em;text-transform:uppercase;color:#775e3e;margin-top:2px}

.current-label:after{content:"";height:1px;background:#7e674650;flex:1}

.species{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}

.species span{border:1px solid #8c714b88;border-radius:20px;padding:8px 4px;text-align:center;background:#d9c69f;color:#624b32;font-size:clamp(.8rem,1.7vh,1rem);line-height:1.1}

.note{display:none;margin:auto 0 0;padding-top:10px;border-top:1px dashed #80674666;font-size:clamp(.92rem,1.8vh,1.08rem);line-height:1.3;color:#72593c;min-height:2.6em}

.tabs{display:flex;flex-direction:column;gap:6px;margin-left:-1px;padding:clamp(30px,5vh,48px) 0 16px;align-self:stretch;z-index:6}

/* Virada de página: folha com frente/verso, borda física e sombra móvel. */
.pages { perspective: 2200px; perspective-origin: 50% 48%; transform-style:preserve-3d; }
.pages.is-turning .pg { transition: filter .78s ease; }
.pages.is-turning .pg:first-of-type { filter:brightness(.94); }
.flip-sheet {
  position:absolute !important;
  top:0; bottom:0; width:50%; z-index:14 !important; margin:0;
  overflow:visible !important; pointer-events:none;
  transform-style:preserve-3d; backface-visibility:visible;
  will-change:transform; isolation:isolate;
  border-radius:0 !important; box-shadow:none !important;
}
.flip-sheet.forward { left:50%; transform-origin:left center; }
.flip-sheet.backward { left:0; transform-origin:right center; }
/* Verso da folha: papel envelhecido, ligeiramente mais escuro nas bordas. */
.flip-sheet::before {
  content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 45%,#f2e4c5 0%,#e0cfaa 70%,#c4ad80 100%),
    repeating-linear-gradient(0deg,transparent 0 31px,#6f5a3b0b 31px 32px);
  box-shadow:inset 0 0 0 1px #f6e7c5aa,inset 0 0 0 4px #b49a6b55,inset 0 0 22px #4c382326;
  backface-visibility:hidden; transform:rotateY(180deg);
}
.flip-sheet > * { backface-visibility:hidden; }
.flip-sheet::after {
  content:""; position:absolute; inset:0; z-index:3; pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,#3b28161a 55%,#24170d65 96%,#fff0 100%);
  opacity:.8; backface-visibility:hidden;
}
.flip-sheet.forward { animation: turn-forward .95s cubic-bezier(.42,.02,.18,1) forwards; }
.flip-sheet.backward { animation: turn-backward .95s cubic-bezier(.42,.02,.18,1) forwards; }
@keyframes turn-forward {
  0% { transform:rotateY(0deg); filter:brightness(1); }
  18% { filter:brightness(.93); }
  48% { filter:brightness(.72); }
  76% { filter:brightness(.86); }
  100% { transform:rotateY(-180deg); filter:brightness(1); }
}
@keyframes turn-backward {
  0% { transform:rotateY(0deg); filter:brightness(1); }
  18% { filter:brightness(.93); }
  48% { filter:brightness(.72); }
  76% { filter:brightness(.86); }
  100% { transform:rotateY(180deg); filter:brightness(1); }
}
/* A sombra acompanha a folha sobre o papel que fica por baixo. */
.pages.is-turning::after {
  content:""; position:absolute; z-index:13; pointer-events:none;
  top:0; bottom:0; left:35%; width:30%;
  background:linear-gradient(90deg,transparent,#35231512 22%,#24170d45 50%,#35231512 78%,transparent);
  animation:spine-shadow .95s ease-in-out forwards;
}
@keyframes spine-shadow {
  0% { opacity:0; transform:translateX(35%); }
  35% { opacity:.8; }
  70% { opacity:.55; }
  100% { opacity:0; transform:translateX(-35%); }
}
@media (prefers-reduced-motion: reduce) {
  .flip-sheet.forward,.flip-sheet.backward { animation-duration:.01ms; }
  .pages.is-turning::after { animation-duration:.01ms; }
}
@media(max-width:760px) {
  .flip-sheet { display:none !important; }
  .pages.is-turning::after { display:none; }
}

<body>

<main class="book" aria-label="Livro de estímulos para adultos">

 <section class="pages" id="pages" aria-label="Páginas do livro"></section>
 <button class="book-nav prev" id="prevPage" type="button" aria-label="Virar para a página anterior" title="Página anterior"><span aria-hidden="true">‹</span></button>
 <button class="book-nav next" id="nextPage" type="button" aria-label="Virar para a próxima página" title="Próxima página"><span aria-hidden="true">›</span></button>

 <nav class="tabs" id="tabs" role="tablist" aria-label="Capítulos"></nav>

</main>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
const CAPITULOS=[
 {n:"WAIS-IV",s:"Escala de inteligência para adultos",i:[["Completar Figuras","estimulo.html?t=completar"],["Raciocínio Matricial","estimulo.html?t=matricial"],["Códigos","estimulo.html?t=codigos"],["Procurar Símbolos","estimulo.html?t=simbolos"]]},
 {n:"ADOS",s:"Autismo e cognição social",i:[["Tuesday","estimulo.html?t=tuesday"],["Eyes","estimulo.html?t=eyes"]]},
 {n:"Atenção",s:"Atenção e controle inibitório",i:[["BPA","estimulo.html?t=bpa"],["CTA","estimulo.html?t=cta"],["D2-R","estimulo.html?t=d2r"],["FDT","estimulo.html?t=fdt"]]},
 {n:"Visual",s:"Percepção e organização visual",i:[["Hooper","estimulo.html?t=hooper"],["Figura de Rey","estimulo.html?t=rey"]]},
 {n:"Linguagem",s:"Nomeação e leitura",i:[["Nomeação de Boston","estimulo.html?t=boston"],["TLPP","estimulo.html?t=tlpp"]]}
];
const SIZES=[94,86,104,90,82,98];
const pagesEl=document.getElementById('pages'), tabs=document.getElementById('tabs');
let flipBook=null, currentChapter=0;
function makeSeal(label,href,index){
 const el=document.createElement(href?'a':'button');
 el.className='seal'+(label.startsWith('+')?' new':'');
 el.style.setProperty('--s',SIZES[index%SIZES.length]+'px'); el.textContent=label;
 if(href){el.href=href;el.target='_blank';el.rel='noopener noreferrer';}
 else {el.type='button';el.addEventListener('click',()=>{
   const note=el.closest('.pg')?.querySelector('.note');
   if(note)note.textContent=label.startsWith('+')?'Espaço livre para adicionar uma nova página de estímulos.':'Esta página de estímulos ainda não tem um link associado.';
 });}
 return el;
}
function makeSeals(items,offset){
 const wrap=document.createElement('div');wrap.className='seals';
 // Ordem estável para que os selos não mudem de posição a cada renderização.
 items.forEach((item,i)=>{
   const index=i+offset,el=makeSeal(item[0],item[1],index);
   const tilt=[-2.1,1.7,-1.2,2.2,-.8,1.1][index%6];
   el.style.setProperty('--tilt',tilt+'deg');
   el.style.setProperty('--seal-scale',[.98,1,.97,1.01,.99,1][index%6]);
   el.style.marginTop=(index%3)*3+'px'; el.style.marginLeft=(index%2)*4+'px';
   wrap.appendChild(el);
 });
 return wrap;
}
function makeChapterPages(c,k){
 const half=Math.ceil(c.i.length/2),left=document.createElement('article'),right=document.createElement('article');
 left.className='pg left-page chapter-'+k; right.className='pg right-page chapter-'+k;
 const kicker=document.createElement('div');kicker.className='kicker';kicker.textContent='Caderno de avaliação · arquivo visual';
 const head=document.createElement('div');head.className='heading-row';
 const copy=document.createElement('div');copy.className='heading-copy';
 const h=document.createElement('h1');h.textContent=c.n;
 const sub=document.createElement('p');sub.className='sub';sub.textContent=c.s;copy.append(h,sub);
 const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent='FICHA DE ESTÍMULOS';head.append(copy,stamp);
 left.append(kicker,head,makeSeals(c.i.slice(0,half),k*10));
 const bottom=document.createElement('div');bottom.className='left-bottom';
 const figure=document.createElement('figure');figure.className='polaroid';
 const art=document.createElement('div');art.className='art';art.textContent='✦  ◉  ✦';
 const cap=document.createElement('figcaption');cap.textContent='Registro visual · material de apoio';figure.append(art,cap);
 const caption=document.createElement('p');caption.className='left-caption';caption.textContent='Arquivo de estímulos e materiais de consulta.';
 bottom.append(figure,caption);left.append(bottom);
 right.append(makeSeals(c.i.slice(half),k*10+half));
 const footerL=document.createElement('div');footerL.className='kicker page-number';footerL.textContent=String(k*2+1).padStart(2,'0');left.append(footerL);
 const footerR=document.createElement('div');footerR.className='kicker page-number';footerR.textContent=String(k*2+2).padStart(2,'0');right.append(footerR);
 return [left,right];
}
function updateTabs(pageIndex){
 currentChapter=Math.min(CAPITULOS.length-1,Math.floor(pageIndex/2));
 [...tabs.children].forEach((t,j)=>{const active=j===currentChapter;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;});
}
function goToChapter(k){
 k=(k+CAPITULOS.length)%CAPITULOS.length;
 if(flipBook)flipBook.flip(k*2);
 updateTabs(k*2);
}
CAPITULOS.forEach((c,k)=>{
 const b=document.createElement('button');b.className='tab';b.type='button';b.setAttribute('role','tab');b.textContent=c.n;
 b.setAttribute('aria-selected',String(k===0));b.tabIndex=k===0?0:-1;b.addEventListener('click',()=>goToChapter(k));
 b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=(k+(e.key==='ArrowRight'?1:CAPITULOS.length-1))%CAPITULOS.length;tabs.children[next].focus();goToChapter(next);}});
 tabs.appendChild(b);
});
const allPages=[];
CAPITULOS.forEach((c,k)=>allPages.push(...makeChapterPages(c,k)));
allPages.forEach(p=>pagesEl.appendChild(p));
function initFlipBook(){
 if(!window.St||!window.St.PageFlip){
   pagesEl.classList.add('library-fallback');
   console.error('A biblioteca StPageFlip não carregou. Verifique a conexão com a internet.');
   return;
 }
 flipBook=new St.PageFlip(pagesEl,{
   width:520,height:740,size:'stretch',minWidth:280,maxWidth:900,minHeight:360,maxHeight:1280,
   drawShadow:true,flippingTime:1050,usePortrait:true,startPage:0,autoSize:true,
   maxShadowOpacity:.48,showCover:false,mobileScrollSupport:true,clickEventForward:true,
   useMouseEvents:true,swipeDistance:30,showPageCorners:true,disableFlipByClick:false
 });
 flipBook.loadFromHTML(pagesEl.querySelectorAll('.pg'));
 flipBook.on('flip',e=>updateTabs(e.data));
 updateTabs(0);
}
document.getElementById('prevPage').addEventListener('click',()=>{if(flipBook)flipBook.flipPrev();});
document.getElementById('nextPage').addEventListener('click',()=>{if(flipBook)flipBook.flipNext();});
// A biblioteca cria o seu próprio canvas de folhas; aguarda o layout inicial do navegador.
requestAnimationFrame(()=>requestAnimationFrame(initFlipBook));
</script>
